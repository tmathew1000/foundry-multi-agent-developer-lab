# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: ">=1.34.2"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.9"
    azure.ai.projects: ">=1.0.0-beta.4"

name: foundry-travel-buddy-lab
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: travel-model
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: "2026-03-17"
        sku:
          name: GlobalStandard
          capacity: 20
  mcp-server:
    project: .
    host: containerapp
    language: python
    docker:
      path: ./src/mcp_server/Dockerfile
      context: .
      remoteBuild: true
    environmentVariables:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
  travel-buddy:
    project: .
    host: azure.ai.agent
    language: python
    uses:
      - ai-project
      - mcp-server
    kind: hosted
    name: travel-buddy
    description: Four-agent TravelBuddy workflow for a self-paced developer lab.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      TRAVEL_BUDDY_MCP_URL: ${SERVICE_MCP_SERVER_URI}/mcp
      TRAVEL_BUDDY_DESTINATIONS_PATH: data/destinations.json
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
    protocols:
      - protocol: responses
        version: 2.0.0
infra:
  layers:
    - name: foundry
      path: ./infra/foundry
      provider: microsoft.foundry
    - name: mcp
      path: ./infra/mcp
      provider: bicep
      dependsOn:
        - foundry
