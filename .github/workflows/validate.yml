name: Validate lab

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Lint Python
        run: |
          python -m ruff check src scripts tests checkpoints
          python -m ruff format --check src scripts tests checkpoints main.py

      - name: Lint documentation
        run: npx --yes markdownlint-cli2 "**/*.md"

      - name: Validate lab assets
        run: python scripts/verify.py

      - name: Validate checkpoints
        run: |
          python scripts/checkpoint.py 01-tools
          python scripts/checkpoint.py 02-orchestration
          python scripts/start_module.py 2 --dry-run
          python scripts/start_module.py 3 --dry-run
          python scripts/restore_checkpoint.py 2 --dry-run
          python scripts/restore_checkpoint.py 3 --dry-run
