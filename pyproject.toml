[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-travel-buddy"
version = "0.1.0"
description = "Offline-testable Microsoft Foundry multi-agent TravelBuddy lab"
requires-python = ">=3.11"
dependencies = [
  "agent-framework-core>=1.19.0,<2.0.0",
  "agent-framework-foundry>=1.13.1,<2.0.0",
  "agent-framework-foundry-hosting>=1.0.0b260918,<2.0.0",
  "agent-framework-orchestrations>=1.2.0,<2.0.0",
  "azure-ai-projects>=2.6.0,<2.7.0",
  "azure-identity>=1.19.0",
  "azure-monitor-opentelemetry>=1.6.0",
  "mcp[cli]>=1.12.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "openai>=3.0.0,<4.0.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "debugpy>=1.8.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
